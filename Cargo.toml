[package]
name = "icfpc2025"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mock-server"
path = "src/mock-server/main.rs"

[[bin]]
name = "random-walker"
path = "src/random-walker/main.rs"

[dependencies]
actix-web = "4.11.0"
env_logger = "0.11.8"
itertools = "0.14.0"
log = "0.4.28"
rand = "0.9.2"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
